<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics de Migração - Quântico Cloud</title>
  
  <!-- FontAwesome & Chart.js via CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: #161926;
      --card-border: #23283b;
      --text-main: #f3f4f6;
      --text-muted: #8c93a6;
      --text-secondary: #a1a8bd;
      --primary: #3b82f6;
      --green: #10b981;
      --yellow: #f5a623;
      --pink: #ff2d87;
      --cyan: #00d2d3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 24px; min-height: 100vh; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header-title { font-size: 22px; font-weight: 600; }
    .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }

    /* KPIs Superiores */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 12px; }
    .kpi-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .kpi-value { font-size: 28px; font-weight: 700; }

    /* Grid do Painel Central */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    
    .panel-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 12px; }
    .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

    /* Container de Gráficos */
    .chart-container { position: relative; height: 180px; display: flex; justify-content: center; align-items: center; }

    /* Formulário e Filtros */
    .form-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 12px; margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto; gap: 12px; }
    .form-control { background: #1c2130; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px; outline: none; }

    /* Tabela */
    .table-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; overflow-x: auto; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px; color: var(--text-muted); font-size: 12px; border-bottom: 1px solid var(--card-border); }
    td { padding: 14px 12px; border-bottom: 1px solid var(--card-border); font-size: 14px; }

    /* Status Pills */
    .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .status-migrado { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .status-andamento { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
    .status-pendente { background: rgba(245, 166, 35, 0.15); color: var(--yellow); }
    
    .cluster-circle { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .circle-blink { background: var(--cyan); }
    .circle-mg { background: var(--pink); }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <div class="header-bar">
    <div class="header-title"><i class="fa-solid fa-chart-pie"></i> Analytics de Migração</div>
    <button class="btn-primary"><i class="fa-solid fa-cloud-arrow-down"></i> Sincronizado</button>
  </div>

  <!-- KPIs Superiores -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">Total de Servidores</div>
      <div class="kpi-value" id="kpi-total">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Já Migrados</div>
      <div class="kpi-value" style="color: var(--green);" id="kpi-migrados">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Pendentes / Fila</div>
      <div class="kpi-value" style="color: var(--yellow);" id="kpi-pendentes">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Taxa de Conclusão</div>
      <div class="kpi-value" style="color: var(--primary);" id="kpi-taxa">0%</div>
    </div>
  </div>

  <!-- Gráficos Centrais -->
  <div class="dashboard-grid">
    <div class="panel-card">
      <div class="panel-title">Distribuição de Status (Geral)</div>
      <div class="chart-container">
        <canvas id="chartStatusDonut"></canvas>
      </div>
    </div>
    <div class="panel-card">
      <div class="panel-title">Progresso por Cluster</div>
      <div style="display: flex; justify-content: space-around; margin-top: 20px;">
        <div style="text-align: center;">
          <div style="height: 100px; width: 100px; margin: 0 auto;">
            <canvas id="chartBlinkMini"></canvas>
          </div>
          <div style="margin-top: 8px; font-weight: 600;" id="blink-pct-text">0%</div>
          <div style="font-size: 12px; color: var(--text-muted);">Cluster Blink</div>
        </div>
        <div style="text-align: center;">
          <div style="height: 100px; width: 100px; margin: 0 auto;">
            <canvas id="chartMgMini"></canvas>
          </div>
          <div style="margin-top: 8px; font-weight: 600;" id="mg-pct-text">0%</div>
          <div style="font-size: 12px; color: var(--text-muted);">Cluster MG</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Formulário de Cadastro -->
  <div class="form-card">
    <div class="panel-title" style="font-size: 14px; margin-bottom: 12px;">+ Cadastrar Novo Servidor</div>
    <form id="form-cadastro" class="form-grid">
      <input type="text" id="nome-maquina" class="form-control" placeholder="Nome Host (ex: srv-db-01)" required>
      <input type="text" id="origem-maquina" class="form-control" placeholder="Origem (ex: On-Premise)" required>
      <select id="select-cluster" class="form-control">
        <option value="Cluster Blink">Cluster Blink</option>
        <option value="Cluster MG">Cluster MG</option>
      </select>
      <select id="select-status" class="form-control">
        <option value="Pendente">Pendente</option>
        <option value="Em Andamento">Em Andamento</option>
        <option value="Migrado">Migrado</option>
      </select>
      <button type="submit" class="btn-primary"><i class="fa-solid fa-plus"></i> Cadastrar</button>
    </form>
  </div>

  <!-- Tabela de Servidores -->
  <div class="table-container">
    <div class="table-header">
      <div style="font-weight: 600;">Servidores & Status <span id="table-count-badge" style="font-size: 12px; color: var(--text-muted); font-weight: normal;">(0)</span></div>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="filtro-busca" class="form-control" placeholder="Filtrar servidores..." style="width: 200px;">
        <select id="filtro-cluster-select" class="form-control">
          <option value="TODOS">Todos os Clusters</option>
          <option value="Cluster Blink">Cluster Blink</option>
          <option value="Cluster MG">Cluster MG</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>SERVIDOR</th>
          <th>ORIGEM</th>
          <th>CLUSTER ALVO</th>
          <th>STATUS ATUAL</th>
          <th>DATA REGISTRO</th>
          <th style="text-align: right;">AÇÕES</th>
        </tr>
      </thead>
      <tbody id="tabela-maquinas">
        <!-- Preenchido via JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- JAVASCRIPT TOTALMENTE EMBUTIDO (SEM DEPENDER DO APP.JS) -->
  <script>
    const CONFIG = {
      binId: '6aba6670ffd5d16053379470',
      apiKey: '$2a$10$2GS3IXMMHlIzufc5EnxDYedXLztIAI6RuWrJJR8nbDniz6D6aaU.C'
    };

    let maquinas = [];
    let chartGeral = null, chartBlink = null, chartMg = null;

    // 1. CARREGAR DADOS DO JSONBIN (PÚBLICO)
    async function carregarDados() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}/latest`);
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.record) {
          maquinas = Array.isArray(data.record) ? data.record : [data.record];
          renderizar();
        }
      } catch (err) {
        console.error('Erro na conexão:', err);
      }
    }

    // 2. SALVAR NO JSONBIN (USANDO MASTER KEY)
    async function salvarNoJsonbin(dados) {
      if (!Array.isArray(dados) || dados.length === 0) return false;
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': CONFIG.apiKey
          },
          body: JSON.stringify(dados)
        });
        return res.ok;
      } catch (err) {
        return false;
      }
    }

    // 3. EXCLUIR MAQUINA
    async function removerMaquina(id) {
      if (!confirm('Excluir este servidor?')) return;
      maquinas = maquinas.filter(m => m.id !== id);
      const ok = await salvarNoJsonbin(maquinas);
      if (ok) renderizar();
      else carregarDados();
    }

    // 4. INICIALIZAR GRÁFICOS
    function initGraficos() {
      if (typeof Chart === 'undefined') return;

      const ctx1 = document.getElementById('chartStatusDonut').getContext('2d');
      chartGeral = new Chart(ctx1, {
        type: 'doughnut',
        data: { labels: ['Migrado', 'Em Andamento', 'Pendente'], datasets: [{ data: [0, 0, 0], backgroundColor: ['#10b981', '#3b82f6', '#f5a623'], borderWidth: 0 }] },
        options: { cutout: '75%', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      const ctx2 = document.getElementById('chartBlinkMini').getContext('2d');
      chartBlink = new Chart(ctx2, {
        type: 'doughnut',
        data: { datasets: [{ data: [0, 100], backgroundColor: ['#00d2d3', '#1c2130'], borderWidth: 0 }] },
        options: { cutout: '80%', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      const ctx3 = document.getElementById('chartMgMini').getContext('2d');
      chartMg = new Chart(ctx3, {
        type: 'doughnut',
        data: { datasets: [{ data: [0, 100], backgroundColor: ['#ff2d87', '#1c2130'], borderWidth: 0 }] },
        options: { cutout: '80%', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    // 5. RENDERIZAR TELA
    function renderizar() {
      let mig = 0, and = 0, pen = 0;
      let bTot = 0, bMig = 0, mTot = 0, mMig = 0;

      maquinas.forEach(m => {
        if (m.status === 'Migrado') mig++;
        else if (m.status === 'Em Andamento') and++;
        else pen++;

        if (m.cluster === 'Cluster Blink') { bTot++; if (m.status === 'Migrado') bMig++; }
        else if (m.cluster === 'Cluster MG') { mTot++; if (m.status === 'Migrado') mMig++; }
      });

      const total = maquinas.length;
      document.getElementById('kpi-total').innerText = total;
      document.getElementById('kpi-migrados').innerText = mig;
      document.getElementById('kpi-pendentes').innerText = pen;
      document.getElementById('kpi-taxa').innerText = total > 0 ? `${Math.round((mig / total) * 100)}%` : '0%';

      if (chartGeral) { chartGeral.data.datasets[0].data = [mig, and, pen]; chartGeral.update(); }

      const pctB = bTot > 0 ? Math.round((bMig / bTot) * 100) : 0;
      document.getElementById('blink-pct-text').innerText = `${pctB}%`;
      if (chartBlink) { chartBlink.data.datasets[0].data = [pctB, 100 - pctB]; chartBlink.update(); }

      const pctM = mTot > 0 ? Math.round((mMig / mTot) * 100) : 0;
      document.getElementById('mg-pct-text').innerText = `${pctM}%`;
      if (chartMg) { chartMg.data.datasets[0].data = [pctM, 100 - pctM]; chartMg.update(); }

      // Tabela
      const tbody = document.getElementById('tabela-maquinas');
      tbody.innerHTML = '';

      const busca = document.getElementById('filtro-busca').value.toLowerCase();
      const clusterFiltro = document.getElementById('filtro-cluster-select').value;

      const lista = maquinas.filter(m => {
        const okNome = (m.nome && m.nome.toLowerCase().includes(busca)) || (m.origem && m.origem.toLowerCase().includes(busca));
        const okCluster = (clusterFiltro === 'TODOS') || (m.cluster === clusterFiltro);
        return okNome && okCluster;
      });

      document.getElementById('table-count-badge').innerText = `(${lista.length})`;

      lista.forEach(m => {
        let sClass = 'status-pendente', sIcon = 'fa-hourglass-start';
        if (m.status === 'Migrado') { sClass = 'status-migrado'; sIcon = 'fa-check'; }
        else if (m.status === 'Em Andamento') { sClass = 'status-andamento'; sIcon = 'fa-spinner fa-spin'; }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${m.nome || 'Sem Nome'}</strong><br><small style="color:var(--text-muted)">ID: #${m.id.toString().slice(-4)}</small></td>
          <td>${m.origem || 'On-Premise'}</td>
          <td><span class="cluster-circle ${m.cluster === 'Cluster Blink' ? 'circle-blink' : 'circle-mg'}"></span>${m.cluster}</td>
          <td><span class="status-pill ${sClass}"><i class="fa-solid ${sIcon}"></i> ${m.status}</span></td>
          <td style="color:var(--text-secondary)">${m.data || '2026-09-28'}</td>
          <td style="text-align: right;"><button onclick="removerMaquina(${m.id})" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // EVENTOS E INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', () => {
      initGraficos();
      carregarDados();
      setInterval(carregarDados, 5000);

      document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nova = {
          id: Date.now(),
          nome: document.getElementById('nome-maquina').value.trim(),
          origem: document.getElementById('origem-maquina').value.trim(),
          cluster: document.getElementById('select-cluster').value,
          status: document.getElementById('select-status').value,
          data: new Date().toISOString().split('T')[0]
        };
        maquinas.unshift(nova);
        const ok = await salvarNoJsonbin(maquinas);
        if (ok) { renderizar(); e.target.reset(); }
        else { maquinas.shift(); alert('Erro ao salvar no JSONBin.'); }
      });

      document.getElementById('filtro-busca').addEventListener('input', renderizar);
      document.getElementById('filtro-cluster-select').addEventListener('change', renderizar);
    });
  </script>
</body>
</html>
